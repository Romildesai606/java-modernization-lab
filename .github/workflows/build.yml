name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Run the demo
        run: mvn -B -q exec:java -Dexec.mainClass=dev.romildesai.modernization.modern.Demo -Dexec.classpathScope=compile || java -cp target/classes dev.romildesai.modernization.modern.Demo
